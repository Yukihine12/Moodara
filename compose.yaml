services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodara-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    networks:
      - moodara-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3001/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
    container_name: moodara-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - moodara-net

networks:
  moodara-net:
    name: moodara-db_default
    external: true
